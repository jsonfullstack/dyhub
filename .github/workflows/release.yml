# Release 流程：打 tag v* 触发 → typecheck → 构建多架构 Docker 镜像 → 发布 GitHub Release
#
# 使用方式：
#   git tag v0.1.0
#   git push origin v0.1.0
#
# 产物：
#   - Docker 镜像推到 ghcr.io/ymstar/dyhub（amd64 + arm64）
#   - GitHub Release 页面（自动从 PR/commit 生成 Changelog）

name: Release

on:
  push:
    tags:
      - 'v*'

# 同一 tag 重复推送时取消旧的运行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送 GHCR 镜像

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 设置 QEMU（多架构构建依赖）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ymstar/dyhub
          tags: |
            type=ref,event=tag           # v0.1.0
            type=semver,pattern={{version}}      # 0.1.0
            type=semver,pattern={{major}}.{{minor}}  # 0.1
            type=semver,pattern=latest            # latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v0.1.0-rc1 → prerelease
          body: |
            ## Docker 镜像

            ```bash
            docker pull ghcr.io/ymstar/dyhub:${{ steps.meta.outputs.version }}
            ```

            或使用 docker-compose：

            ```yaml
            services:
              dyhub:
                image: ghcr.io/ymstar/dyhub:${{ steps.meta.outputs.version }}
                ports:
                  - "8757:8757"
                shm_size: "2gb"
                volumes:
                  - ./data:/app/data
                restart: unless-stopped
            ```

            支持架构：`linux/amd64`、`linux/arm64`
